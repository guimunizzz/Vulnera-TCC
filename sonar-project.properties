# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Vulnera-TCC
#sonar.projectVersion=1.0

# Fase 8 (Checkpoint 4) — escopo restrito ao backend (app/api): é o único
# workspace com suíte de testes/cobertura rodando no CI hoje (app/web usa
# Vitest mas o pipeline ainda não o chama; app/mobile não tem testes). Também
# é o código avaliado academicamente pelo padrão Factory Method (CLAUDE.md).
# Analisar app/web e app/mobile sem cobertura real inflaria "0% coverage"
# de forma enganosa em vez de refletir o que de fato é testado.
sonar.sources=app/api/src
sonar.tests=app/api/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=app/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
