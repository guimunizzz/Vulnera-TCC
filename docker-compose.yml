# Stack completa (banco + API + web + Mailhog) sobe junta com um comando:
#   docker compose up --build
# Acesso: web http://localhost:8086 (ENTRADA DO APP) · API http://localhost:3001/api ·
# MySQL localhost:3307 · Mailhog http://localhost:8025 · Redis: só na rede interna
#
# ⚠️ Porta de entrada é 8086, não 3000 (decisão de 2026-09-06, ver ADR-022 §
# atualização). Só o mapeamento HOST do serviço `web` mudou — internamente o
# container continua servindo em :3000 (Dockerfile/vite.config.ts não tocados),
# e é por isso que CORS_ORIGIN abaixo também precisou mudar: é o Origin que o
# NAVEGADOR envia (http://localhost:8086), não a porta interna do compose.
#
# ⚠️ A referência original apontava para um "ADR-021 - Stack completa no Docker
# Compose" que nunca foi escrito (commit c131aef, "unificando docker — não
# finalizado"). O número ADR-021 foi ocupado por outra decisão em 2026-08-07
# (máquina de Vulnerability). O trabalho do Docker foi documentado como
# ADR-022.

services:
  db:
    image: mysql:8
    container_name: vulnera-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vulnera
      MYSQL_USER: vulnera
      MYSQL_PASSWORD: vulnera
    ports:
      # host 3307 -> container 3306 (porta 3306 local já é usada pelo serviço
      # Windows MySQL80; dentro do container continua 3306). A API usa o
      # nome do serviço ("db:3306") pela rede interna do compose — só o host
      # (Prisma Studio local, clientes de banco) precisa de 3307.
      - "3307:3306"
    volumes:
      - vulnera-db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP), não localhost (socket): na 1ª subida o servidor temporário do init responde no socket e a API morria com P1001.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./app/api
    container_name: vulnera-api
    environment:
      PORT: "3001"
      NODE_ENV: production
      # db:3306 = nome do serviço na rede interna do compose (não localhost/3307,
      # que é só o mapeamento pro host).
      DATABASE_URL: mysql://vulnera:vulnera@db:3306/vulnera
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_troque_em_producao_0123456789}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_troque_em_producao_9876543210}
      JWT_REFRESH_TTL: 7d
      BCRYPT_COST: "12"
      # Credenciais Turnstile ficam somente no runtime da API, nunca no build web.
      # Sem segredo, o fluxo protegido permanece fail-closed.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_ACTION: ${TURNSTILE_EXPECTED_ACTION:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      # Precisa ser o endereço que o NAVEGADOR usa (a porta de entrada, 8086),
      # não a porta interna do container `web` (3000) — é o header `Origin`
      # que o browser envia em toda requisição à API que o middleware `cors`
      # compara aqui.
      CORS_ORIGIN: http://localhost:8086
      UPLOADS_DIR: uploads
      # Orientação opcional; chave apenas na API. Sem configuração, ajuda local.
      ASSISTANT_MODE: "${ASSISTANT_MODE:-local}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      ASSISTANT_TIMEOUT_MS: "${ASSISTANT_TIMEOUT_MS:-15000}"
      ASSISTANT_MAX_OUTPUT_TOKENS: "${ASSISTANT_MAX_OUTPUT_TOKENS:-500}"
      RATE_LIMIT_ASSISTANT_USER_PER_HOUR: "${RATE_LIMIT_ASSISTANT_USER_PER_HOUR:-10}"
      RATE_LIMIT_ASSISTANT_USER_BURST: "${RATE_LIMIT_ASSISTANT_USER_BURST:-5}"
      RATE_LIMIT_ASSISTANT_GLOBAL_PER_HOUR: "${RATE_LIMIT_ASSISTANT_GLOBAL_PER_HOUR:-30}"
      RATE_LIMIT_ASSISTANT_GLOBAL_BURST: "${RATE_LIMIT_ASSISTANT_GLOBAL_BURST:-10}"
      # ---------------------------------------------------------------------
      # Módulo DAST (OWASP ZAP) — scan REAL dentro da stack, desde 2026-09-09.
      # Ver docs/DAST-DOCKER-GAP.md (diagnóstico) e ADR-031 (decisão).
      # ---------------------------------------------------------------------
      # Rede onde o container do ZAP é criado. Precisa ser a MESMA da API: é
      # assim que a API alcança o daemon do ZAP pelo NOME do container
      # (http://vulnera-zap-<scanId>:8080), sem publicar porta nenhuma no host.
      DAST_ZAP_NETWORK: vulnera-net
      DAST_ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      DAST_REPORTS_DIR: dast-reports
      # Teto de scans simultâneos — o watchdog enfileira o excedente.
      DAST_MAX_CONCURRENT_SCANS: "${DAST_MAX_CONCURRENT_SCANS:-1}"
      # Teto de recurso de CADA container do ZAP. Os dois limites são de eixos
      # diferentes e um NÃO cobre o outro: o de cima limita QUANTOS scans
      # rodam, estes limitam QUANTO cada um consome. Sem eles (medido em
      # 2026-09-09) 2 scans simultâneos ocupavam ~960% de 1200% de CPU e
      # cresciam sem teto de RAM — respeitar o limite de 2 e ainda assim
      # travar a máquina não é respeitar limite nenhum.
      # Um ZAP de 2 GiB por vez deixa folga para API/MySQL numa WSL de 4 GB.
      # Ajuste os três limites juntos ao aumentar a concorrência.
      DAST_ZAP_MEMORY: "${DAST_ZAP_MEMORY:-2g}"
      DAST_ZAP_CPUS: "${DAST_ZAP_CPUS:-2}"
      DAST_SCAN_TIMEOUT_MS: "${DAST_SCAN_TIMEOUT_MS:-1800000}"
      DAST_ZAP_HTTP_TIMEOUT_MS: "${DAST_ZAP_HTTP_TIMEOUT_MS:-45000}"
      DAST_ZAP_HTTP_ATTEMPTS: "${DAST_ZAP_HTTP_ATTEMPTS:-3}"
      DAST_ZAP_SPIDER_MAX_DURATION_MIN: "${DAST_ZAP_SPIDER_MAX_DURATION_MIN:-1}"
      DAST_ZAP_STARTUP_TIMEOUT_MS: "${DAST_ZAP_STARTUP_TIMEOUT_MS:-180000}"
      DAST_FORCE_SIMULATE: "false"
      NVD_API_KEY: "${NVD_API_KEY:-}"
      # Threat Intel (ADR-053): liga/desliga e intervalo (mínimo 15 min). Com
      # QUEUE_DRIVER=bullmq viram o job scheduler `threat-intel-sync` (ADR-056).
      THREAT_INTEL_SYNC_ENABLED: "${THREAT_INTEL_SYNC_ENABLED:-true}"
      THREAT_INTEL_SYNC_INTERVAL_MIN: "${THREAT_INTEL_SYNC_INTERVAL_MIN:-360}"
      # ---------------------------------------------------------------------
      # Fila de jobs (ADR-056). memory = comportamento de sempre (watchdog em
      # memória + setInterval da Threat Intel); bullmq = fila no Redis abaixo.
      # Voltar atrás: QUEUE_DRIVER=memory e `docker compose up -d api`.
      # ---------------------------------------------------------------------
      QUEUE_DRIVER: "${QUEUE_DRIVER:-memory}"
      # Mesma senha do serviço redis. Só é lida com QUEUE_DRIVER=bullmq.
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev_redis_troque_em_producao_0123456789}@redis:6379"
      # false = a API não sobe os workers; eles rodam num serviço próprio com
      # `command: npm run worker` (mesma imagem, sem mudar código).
      WORKER_IN_PROCESS: "${WORKER_IN_PROCESS:-true}"
      # Alvos HTTP/HTTPS internos e públicos são aceitos. O endereço precisa
      # ser alcançável pela rede do container do ZAP (ver docs/DAST.md).
    ports:
      - "3001:3001"
    volumes:
      # evidências sobrevivem a `docker compose down` (sem -v)
      - vulnera-api-uploads:/app/uploads
      # relatórios do ZAP idem — quem escreve aqui é o processo Node da API
      # (baixa report.json/html pela API HTTP do ZAP), NÃO o container do ZAP:
      # por isso este volume não precisa ser visível pro daemon do host.
      - vulnera-api-dast-reports:/app/dast-reports
      # ⚠️ DooD (Docker outside of Docker): dá à API acesso ao daemon do HOST
      # pra ela subir o container do ZAP. Quem alcança este socket controla o
      # Docker do host inteiro — risco aceito e registrado em ADR-031, válido
      # pra máquina de desenvolvimento/demonstração, NÃO pra produção.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      # Com bullmq a API conecta no boot; esperar o Redis saudável evita um
      # erro de conexão inútil no log. Com memory o Redis só fica parado.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./app/web
      args:
        # endereço que o NAVEGADOR (no host) usa — não o nome do serviço Docker.
        # Vite embute isso no bundle em build time, não dá pra trocar depois.
        VITE_API_URL: http://localhost:3001/api
        # Chave pública e action entram no build do web; sem chave, o widget bloqueia.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_ACTION: ${VITE_TURNSTILE_ACTION:-access-request}
    container_name: vulnera-web
    ports:
      # host 8086 -> container 3000: 8086 é a PORTA DE ENTRADA do app inteiro
      # (é a que o navegador acessa). Internamente o `vite preview` continua
      # em 3000 (vite.config.ts, Dockerfile) — só o lado esquerdo do mapa muda.
      - "8086:3000"
    depends_on:
      api:
        condition: service_healthy

  # Fila de jobs do BullMQ (ADR-056). Redis 8.8 (licença escolhida: AGPLv3,
  # dentre RSALv2/SSPLv1/AGPLv3), sem modificação, como serviço separado.
  #   - SEM `ports:` de propósito: só a rede interna vulnera-net alcança.
  #   - Senha obrigatória (REDIS_PASSWORD, default de dev no padrão dos JWT_*).
  #   - noeviction: única política com que o BullMQ funciona corretamente
  #     (https://docs.bullmq.io/guide/going-to-production) — com memória cheia
  #     o Redis recusa escrita em vez de apagar job em silêncio.
  #   - appendonly: a fila sobrevive a restart do container.
  redis:
    image: redis:8.8.4-alpine
    container_name: vulnera-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_troque_em_producao_0123456789}
      # redis-cli lê a senha daqui: o healthcheck não precisa de -a na linha de comando.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-dev_redis_troque_em_producao_0123456789}
    # $$ = o compose passa "$" literal e o shell do container expande a
    # variável, então a senha não aparece no `command` do `docker inspect`.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    volumes:
      - vulnera-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vulnera-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vulnera-db-data:
  vulnera-api-uploads:
  vulnera-api-dast-reports:
  vulnera-redis-data:

# Rede com NOME FIXO (sem isso o compose geraria "vulnera-tcc_default", que
# depende do nome da pasta do projeto). O nome precisa ser previsível porque a
# API o repassa pro `docker run --network` do container do ZAP — ver
# DAST_ZAP_NETWORK acima.
networks:
  default:
    name: vulnera-net
