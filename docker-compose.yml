# Stack completa (banco + API + web + Mailhog) sobe junta com um comando:
#   docker compose up --build
# Acesso: web http://localhost:8086 (ENTRADA DO APP) · API http://localhost:3001/api ·
# MySQL localhost:3307 · Mailhog http://localhost:8025
#
# ⚠️ Porta de entrada é 8086, não 3000 (decisão de 2026-09-06, ver ADR-022 §
# atualização). Só o mapeamento HOST do serviço `web` mudou — internamente o
# container continua servindo em :3000 (Dockerfile/vite.config.ts não tocados),
# e é por isso que CORS_ORIGIN abaixo também precisou mudar: é o Origin que o
# NAVEGADOR envia (http://localhost:8086), não a porta interna do compose.
#
# ⚠️ A referência original apontava para um "ADR-021 - Stack completa no Docker
# Compose" que nunca foi escrito (commit c131aef, "unificando docker — não
# finalizado"). O número ADR-021 foi ocupado por outra decisão em 2026-08-07
# (máquina de Vulnerability). O trabalho do Docker foi documentado como
# ADR-022.

services:
  db:
    image: mysql:8
    container_name: vulnera-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vulnera
      MYSQL_USER: vulnera
      MYSQL_PASSWORD: vulnera
    ports:
      # host 3307 -> container 3306 (porta 3306 local já é usada pelo serviço
      # Windows MySQL80; dentro do container continua 3306). A API usa o
      # nome do serviço ("db:3306") pela rede interna do compose — só o host
      # (Prisma Studio local, clientes de banco) precisa de 3307.
      - "3307:3306"
    volumes:
      - vulnera-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./app/api
    container_name: vulnera-api
    environment:
      PORT: "3001"
      NODE_ENV: production
      # db:3306 = nome do serviço na rede interna do compose (não localhost/3307,
      # que é só o mapeamento pro host).
      DATABASE_URL: mysql://vulnera:vulnera@db:3306/vulnera
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_troque_em_producao_0123456789}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_troque_em_producao_9876543210}
      JWT_REFRESH_TTL: 7d
      BCRYPT_COST: "12"
      # Precisa ser o endereço que o NAVEGADOR usa (a porta de entrada, 8086),
      # não a porta interna do container `web` (3000) — é o header `Origin`
      # que o browser envia em toda requisição à API que o middleware `cors`
      # compara aqui.
      CORS_ORIGIN: http://localhost:8086
      UPLOADS_DIR: uploads
      # ---------------------------------------------------------------------
      # Módulo DAST (OWASP ZAP) — scan REAL dentro da stack, desde 2026-09-09.
      # Ver docs/DAST-DOCKER-GAP.md (diagnóstico) e ADR-031 (decisão).
      # ---------------------------------------------------------------------
      # Rede onde o container do ZAP é criado. Precisa ser a MESMA da API: é
      # assim que a API alcança o daemon do ZAP pelo NOME do container
      # (http://vulnera-zap-<scanId>:8080), sem publicar porta nenhuma no host.
      DAST_ZAP_NETWORK: vulnera-net
      DAST_ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      DAST_REPORTS_DIR: dast-reports
      # Teto de scans simultâneos — o watchdog enfileira o excedente.
      DAST_MAX_CONCURRENT_SCANS: "2"
      # Teto de recurso de CADA container do ZAP. Os dois limites são de eixos
      # diferentes e um NÃO cobre o outro: o de cima limita QUANTOS scans
      # rodam, estes limitam QUANTO cada um consome. Sem eles (medido em
      # 2026-09-09) 2 scans simultâneos ocupavam ~960% de 1200% de CPU e
      # cresciam sem teto de RAM — respeitar o limite de 2 e ainda assim
      # travar a máquina não é respeitar limite nenhum.
      # 2 scans x 2g = 4g dos ~7.7g da VM do Docker, sobrando folga pro MySQL
      # e pela API. Ajuste junto com DAST_MAX_CONCURRENT_SCANS.
      DAST_ZAP_MEMORY: "2g"
      DAST_ZAP_CPUS: "4"
      DAST_SCAN_TIMEOUT_MS: "1800000"
      # ⚠️ SSRF: "true" só pra escanear alvo local (Juice Shop na própria
      # máquina) durante a demonstração. Padrão continua bloqueando.
      DAST_ALLOW_PRIVATE_TARGETS: "false"
    ports:
      - "3001:3001"
    volumes:
      # evidências sobrevivem a `docker compose down` (sem -v)
      - vulnera-api-uploads:/app/uploads
      # relatórios do ZAP idem — quem escreve aqui é o processo Node da API
      # (baixa report.json/html pela API HTTP do ZAP), NÃO o container do ZAP:
      # por isso este volume não precisa ser visível pro daemon do host.
      - vulnera-api-dast-reports:/app/dast-reports
      # ⚠️ DooD (Docker outside of Docker): dá à API acesso ao daemon do HOST
      # pra ela subir o container do ZAP. Quem alcança este socket controla o
      # Docker do host inteiro — risco aceito e registrado em ADR-031, válido
      # pra máquina de desenvolvimento/demonstração, NÃO pra produção.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./app/web
      args:
        # endereço que o NAVEGADOR (no host) usa — não o nome do serviço Docker.
        # Vite embute isso no bundle em build time, não dá pra trocar depois.
        VITE_API_URL: http://localhost:3001/api
    container_name: vulnera-web
    ports:
      # host 8086 -> container 3000: 8086 é a PORTA DE ENTRADA do app inteiro
      # (é a que o navegador acessa). Internamente o `vite preview` continua
      # em 3000 (vite.config.ts, Dockerfile) — só o lado esquerdo do mapa muda.
      - "8086:3000"
    depends_on:
      api:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vulnera-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vulnera-db-data:
  vulnera-api-uploads:
  vulnera-api-dast-reports:

# Rede com NOME FIXO (sem isso o compose geraria "vulnera-tcc_default", que
# depende do nome da pasta do projeto). O nome precisa ser previsível porque a
# API o repassa pro `docker run --network` do container do ZAP — ver
# DAST_ZAP_NETWORK acima.
networks:
  default:
    name: vulnera-net
