<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Vulnera</title>

    <!--
      TEMA ANTES DO PRIMEIRO PAINT.

      Este script é síncrono e fica no <head> de propósito: o navegador PARA de
      construir a página até executá-lo. É a única forma de estampar
      `data-theme` antes de existir qualquer pixel. Se o tema fosse aplicado no
      React, a página apareceria escura (o padrão do CSS) por um quadro e
      trocaria para clara depois — o "flash" que o CP1 proíbe.

      É uma cópia mínima de `src/design/theme.ts`. A duplicação é deliberada:
      um módulo importado seria carregado depois do parse do HTML, tarde demais.
      A chave e os valores TÊM que bater com os de lá — `theme.test.ts` confere.

      O try/catch existe porque `localStorage` lança em modo privado de alguns
      navegadores. Falhar aqui deixaria a página em branco.

      O segundo bloco faz o mesmo para o menu de acessibilidade (cópia mínima de
      `src/design/accessibility.ts`): quem pediu texto a 150% não pode ver a
      página nascer em 100% e pular. O teste A11Y-PREF-01 confere a cópia.
    -->
    <script>
      (function () {
        try {
          var escolhido = localStorage.getItem("vulnera:theme");
          if (escolhido !== "dark" && escolhido !== "light" && escolhido !== "system") escolhido = "dark";
          var resolvido =
            escolhido === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : escolhido;
          document.documentElement.setAttribute("data-theme", resolvido);
          document.documentElement.style.colorScheme = resolvido;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        try {
          var a11y = JSON.parse(localStorage.getItem("vulnera:a11y") || "{}") || {};
          var raiz = document.documentElement;
          if ([1.1, 1.25, 1.5, 1.75, 2].indexOf(a11y.escalaFonte) >= 0) {
            raiz.style.setProperty("--a11y-escala-fonte", String(a11y.escalaFonte));
          }
          var atributos = {
            altoContraste: "data-alto-contraste",
            reduzirMovimento: "data-reduzir-movimento",
            sublinharLinks: "data-sublinhar-links",
            espacamentoTexto: "data-espacamento-texto",
            focoReforcado: "data-foco-reforcado"
          };
          for (var opcao in atributos) if (a11y[opcao] === true) raiz.setAttribute(atributos[opcao], "");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
